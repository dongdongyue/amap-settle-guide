function fillPanel(){var s=AREAS.sort(function(a,b){return b.score-a.score}),m=['🥇','🥈','🥉'];s.forEach(function(a,i){var peak=Math.round(a.transit.duration*1.3),sc=a.score>=75?'#52c41a':'#faad14';document.getElementById('cardSlider').innerHTML+='<div class="area-card'+(i===0?' selected':'')+'" onclick="showDetail(AREAS['+AREAS.indexOf(a)+'])" style="border-left:3px solid '+a.color+'"><div class="card-header"><div class="card-name" style="color:'+a.color+'">'+m[i]+' '+a.name+'</div><div class="card-score" style="background:'+sc+'">'+a.score+'</div></div><div class="card-commute"><div class="commute-item"><div class="commute-num">'+a.transit.duration+'<span style="font-size:10px;color:#999">~'+peak+'min</span></div><div class="commute-lbl">🚌 公交</div></div><div class="commute-item"><div class="commute-num">'+a.amenities.market+'<span style="font-size:10px;color:#999">个</span></div><div class="commute-lbl">超市</div></div></div>'+(a.tags.length?'<div style="margin-bottom:6px">'+a.tags.map(function(t){return '<span style="font-size:10px;background:#f0f5ff;color:#1890ff;padding:2px 6px;border-radius:8px;margin-right:4px">'+t+'</span>'}).join('')+'</div>':'')+'<div style="font-size:12px;color:#52c41a;font-weight:600">💰 ¥'+a.livingCost+'/月</div></div>'});s.forEach(function(a,i){document.getElementById('rankList').innerHTML+='<div class="rank-item" onclick="showDetail(AREAS['+AREAS.indexOf(a)+'])" style="cursor:pointer"><span class="rank-medal">'+m[i]+'</span><span class="rank-name" style="color:'+a.color+'">'+a.name+'</span><div class="rank-bar-wrap"><div class="rank-bar" style="width:'+a.score+'%;background:'+a.color+'"></div></div><span class="rank-score">'+a.score+'</span></div>'})}

function drawRoutes(mode){if(!map||!AMapRef)return;clearRoutes();var from=new AMapRef.LngLat(WORKPLACE.location[0],WORKPLACE.location[1]);AREAS.forEach(function(a){var to=new AMapRef.LngLat(a.location[0],a.location[1]);if(mode==='driving'){try{var d=new AMapRef.Driving({map:map,hideMarkers:true,autoFitView:false});routePlanners.push(d);d.search(from,to,function(){})}catch(e){}}else{try{var t=new AMapRef.Transfer({map:map,policy:AMapRef.TransferPolicy.LEAST_TIME,hideMarkers:true,autoFitView:false,city:'北京'});routePlanners.push(t);t.search(from,to,function(s){if(s!=='complete')new AMapRef.Polyline({map:map,path:[from,to],strokeColor:a.color,strokeWeight:2,strokeStyle:'dashed',strokeOpacity:.6,showDir:true})})}catch(e){new AMapRef.Polyline({map:map,path:[from,to],strokeColor:a.color,strokeWeight:2,strokeStyle:'dashed',strokeOpacity:.6,showDir:true})}}})}
