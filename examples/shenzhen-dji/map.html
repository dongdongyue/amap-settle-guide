document.querySelectorAll('#route-mode button').forEach(function(btn) { btn.addEventListener('click', function() { document.querySelector('#route-mode .active').classList.remove('active'); btn.classList.add('active'); currentMode=btn.dataset.mode; drawRoutes(currentMode); }); });

AMapLoader.load({ key: JS_KEY, version: '2.0', plugins: ['AMap.Driving', 'AMap.Transfer'] }).then(function(AMap) {
  AMapRef = AMap; map = new AMap.Map('container', { center: [113.93, 22.54], zoom: 12, viewMode: '2D' });
  new AMap.Marker({ position: WORKPLACE.location, map: map, content: '<div style="background:#333;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap">🏢 '+WORKPLACE.name+'</div>' });
  AREAS.forEach(function(area, i) {
    var icon = area.transit.mode === 'walk' ? '🚶' : '📍';
    var badge = '';
    if (area.recommend === 'best') badge = ' <span style="background:#52c41a;padding:1px 5px;border-radius:4px;font-size:10px;margin-left:4px">推荐</span>';
    else if (area.recommend === 'intern') badge = ' <span style="background:#fa8c16;padding:1px 5px;border-radius:4px;font-size:10px;margin-left:4px">实习生首选</span>';
    else if (area.recommend === 'cheap') badge = ' <span style="background:#eb2f96;padding:1px 5px;border-radius:4px;font-size:10px;margin-left:4px">最省钱</span>';
    new AMap.Marker({ position: area.location, map: map, content: '<div style="background:'+area.color+';color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer" onclick="showDetail(AREAS['+i+'])">'+icon+' '+area.name+badge+'</div>' });
  });
  drawRoutes('transfer');
}).catch(function(){});

function fillPanel() {
  var medals=['🥇','🥈','🥉','④','⑤'], sorted=AREAS.slice().sort(function(a,b){return b.score-a.score}), maxScore=sorted[0].score;
  var slider=document.getElementById('card-slider'); slider.innerHTML='';
  AREAS.forEach(function(area,i){
    var sc=area.score>=75?'#52c41a':'#faad14', lr=area.listings[0].price, at='';
    Object.entries(area.amenities).forEach(function(p){at+='<span class="amenity-tag">'+(AMENITY_LABELS[p[0]]||p[0])+' <b>'+p[1]+'</b></span>'});
    var commuteText = area.transit.mode==='walk' ? '🚶 '+area.transit.duration+'min' : area.transit.duration+'min';
    var commuteLbl = area.transit.mode==='walk' ? '骑行可达' : (area.transit.transfers===0?'直达':area.transit.transfers+'次换乘');
    var badgeHtml = '';
    if (area.recommend === 'best') badgeHtml = '<div style="font-size:10px;color:#52c41a;font-weight:600;margin-bottom:6px">✅ 应届生推荐</div>';
    else if (area.recommend === 'intern') badgeHtml = '<div style="font-size:10px;color:#fa8c16;font-weight:600;margin-bottom:6px">🎓 实习生首选</div>';
    else if (area.recommend === 'cheap') badgeHtml = '<div style="font-size:10px;color:#eb2f96;font-weight:600;margin-bottom:6px">💰 极致省钱</div>';
    slider.innerHTML+='<div class="area-card" onclick="showDetail(AREAS['+i+'])">'+badgeHtml+'<div class="card-header"><span class="card-name">'+medals[i]+' '+area.name+'</span><span class="card-score" style="background:'+sc+'">'+area.score+'</span></div><div class="card-commute"><div class="commute-item"><div class="commute-num">'+commuteText+'</div><div class="commute-lbl">'+commuteLbl+'</div></div><div class="commute-item"><div class="commute-num">'+lr+'元起</div><div class="commute-lbl">💰 合租最低</div></div></div><div style="font-size:10px;color:#999;margin-top:6px">每月总支出约 '+area.livingCost+'元 · 适合'+area.bestFor+'</div><div class="card-amenity">'+at+'</div></div>';
  });
  var rank=document.getElementById('rank-section'); rank.innerHTML='<div class="rank-title">📊 排名详情</div>';
  sorted.forEach(function(area,i){var bc=area.score>=75?'#52c41a':'#faad14';rank.innerHTML+='<div class="rank-item"><span class="rank-medal">'+medals[i]+'</span><span class="rank-name">'+area.name+'</span><div class="rank-bar-wrap"><div class="rank-bar" style="width:'+Math.round(area.score/maxScore*100)+'%;background:'+bc+'"></div></div><span class="rank-score-text">'+area.score+'</span></div>'});
}
</script>
</body>
</html>
